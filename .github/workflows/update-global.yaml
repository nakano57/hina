name: Update-Global

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

permissions: write-all

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          ref: "global" # Get the right branch
          fetch-depth: "0" # Get all branch first
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Installing requirements
        run: |
          uv pip install -r requirements.txt
      - name: Retrieving models
        run: |
          uv python ./py/getModelsGlobal.py
      - name: Generating models.json
        run: |
          uv python ./py/generateModelsJson.py
      - name: Generating audio.json
        run: |
          uv python ./py/generateAudioJsonGlobal.py
      - name: Commit files
        run: |
          git add .
          git config --global user.email "bot@github.com"
          git config --global user.name "Github Bot"
          git commit -m "[Update] $(cat ./data/version.txt)"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true
          branch: global
